<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messenger — Rust + Tokio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc 50%,
                    #e0f2fe
                );

            color: #172033;
        }

        .app {
            width: min(1100px, 100%);
            height: min(760px, 100vh);

            margin: auto;
            display: grid;

            grid-template-columns: 280px 1fr;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 25px 70px
                rgba(30, 41, 59, 0.15);

            backdrop-filter: blur(18px);
        }

        .sidebar {
            padding: 24px;

            background:
                linear-gradient(
                    180deg,
                    #172554,
                    #1e3a8a
                );

            color: white;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 36px;
        }

        .logo {
            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background: #ffffff;

            color: #1d4ed8;
            font-size: 23px;
        }

        .brand h1 {
            margin: 0;
            font-size: 19px;
        }

        .brand p {
            margin: 3px 0 0;

            color: #bfdbfe;
            font-size: 12px;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 12px;

            border-radius: 12px;

            background:
                rgba(255, 255, 255, 0.1);

            font-size: 13px;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;
            background: #f87171;
        }

        .status-dot.online {
            background: #4ade80;
        }

        .sidebar-info {
            margin-top: 30px;

            padding: 18px;

            border-radius: 16px;

            background:
                rgba(255, 255, 255, 0.08);
        }

        .sidebar-info h3 {
            margin-top: 0;
            font-size: 14px;
        }

        .sidebar-info p {
            margin-bottom: 0;

            color: #bfdbfe;
            font-size: 13px;
            line-height: 1.6;
        }

        .chat {
            min-width: 0;

            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px 28px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #e2e8f0;
        }

        .chat-title h2 {
            margin: 0;
            font-size: 18px;
        }

        .chat-title span {
            color: #64748b;
            font-size: 13px;
        }

        .username {
            padding: 9px 14px;

            border-radius: 10px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 13px;
            font-weight: 700;
        }

        #messages {
            flex: 1;
            overflow-y: auto;

            padding: 28px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 75%;

            padding: 12px 16px;

            border-radius: 16px;

            background: #f1f5f9;

            line-height: 1.45;
        }

        .message-name {
            margin-bottom: 4px;

            color: #2563eb;

            font-size: 12px;
            font-weight: 800;
        }

        .system {
            align-self: center;

            padding: 8px 14px;

            border-radius: 999px;

            background: #fef3c7;

            color: #92400e;

            font-size: 12px;
        }

        .input-area {
            padding: 20px 28px;

            display: flex;
            gap: 12px;

            border-top: 1px solid #e2e8f0;
        }

        #message-input {
            flex: 1;

            padding: 14px 16px;

            border: 1px solid #cbd5e1;
            border-radius: 12px;

            outline: none;

            font-size: 14px;
        }

        #message-input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 4px
                rgba(59, 130, 246, 0.12);
        }

        button {
            border: none;

            padding: 0 22px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 720px) {
            .app {
                height: 100vh;
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            #messages {
                padding: 18px;
            }

            .chat-header,
            .input-area {
                padding: 16px;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="logo">💬</div>

            <div>
                <h1>Messenger</h1>
                <p>Rust + Tokio Edition</p>
            </div>
        </div>

        <div class="connection">
            <span
                class="status-dot"
                id="status-dot"
            ></span>

            <span id="status-text">
                Подключение...
            </span>
        </div>

        <div class="sidebar-info">
            <h3>Команды</h3>

            <p>
                <b>/nick имя</b><br>
                Изменить никнейм
            </p>

            <p>
                <b>/users</b><br>
                Показать пользователей
            </p>

            <p>
                <b>/help</b><br>
                Помощь
            </p>
        </div>

    </aside>

    <main class="chat">

        <header class="chat-header">

            <div class="chat-title">
                <h2>Общий чат</h2>
                <span>WebSocket · Tokio Runtime</span>
            </div>

            <div
                class="username"
                id="username"
            >
                Guest
            </div>

        </header>

        <section id="messages"></section>

        <form
            class="input-area"
            id="message-form"
        >

            <input
                id="message-input"
                type="text"
                placeholder="Напишите сообщение..."
                autocomplete="off"
                maxlength="500"
            >

            <button
                type="submit"
                id="send-button"
                disabled
            >
                Отправить
            </button>

        </form>

    </main>

</div>

<script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const button = document.getElementById("send-button");

    const statusDot =
        document.getElementById("status-dot");

    const statusText =
        document.getElementById("status-text");

    const usernameElement =
        document.getElementById("username");

    let username = null;

    const protocol =
        location.protocol === "https:"
            ? "wss"
            : "ws";

    const socket = new WebSocket(
        `${protocol}://${location.host}/ws`
    );

    function addSystemMessage(text) {
        const element =
            document.createElement("div");

        element.className = "system";
        element.textContent = text;

        messages.appendChild(element);
        scrollToBottom();
    }

    function addMessage(name, text) {
        const element =
            document.createElement("div");

        element.className = "message";

        const nameElement =
            document.createElement("div");

        nameElement.className =
            "message-name";

        nameElement.textContent = name;

        const textElement =
            document.createElement("div");

        textElement.textContent = text;

        element.appendChild(nameElement);
        element.appendChild(textElement);

        messages.appendChild(element);
        scrollToBottom();
    }

    function scrollToBottom() {
        messages.scrollTop =
            messages.scrollHeight;
    }

    socket.addEventListener("open", () => {
        statusDot.classList.add("online");
        statusText.textContent = "Подключено";

        button.disabled = false;

        addSystemMessage(
            "Вы подключились к серверу."
        );
    });

    socket.addEventListener("close", () => {
        statusDot.classList.remove("online");
        statusText.textContent = "Соединение закрыто";

        button.disabled = true;

        addSystemMessage(
            "Соединение с сервером закрыто."
        );
    });

    socket.addEventListener("error", () => {
        addSystemMessage(
            "Не удалось подключиться к серверу."
        );
    });

    socket.addEventListener(
        "message",
        (event) => {
            const data = event.data;

            if (data.startsWith("SYSTEM|")) {
                addSystemMessage(
                    data.substring(7)
                );

                return;
            }

            if (data.startsWith("MESSAGE|")) {
                const parts =
                    data.split("|");

                const name = parts[1];

                const text =
                    parts.slice(2).join("|");

                addMessage(name, text);

                return;
            }

            if (data.startsWith("PRIVATE|")) {
                const parts =
                    data.split("|");

                const target = parts[1];

                const text =
                    parts.slice(2).join("|");

                if (
                    username === null ||
                    target === username
                ) {
                    addSystemMessage(text);
                }

                return;
            }

            addSystemMessage(data);
        }
    );

    form.addEventListener(
        "submit",
        (event) => {
            event.preventDefault();

            const message =
                input.value.trim();

            if (
                !message ||
                socket.readyState !== WebSocket.OPEN
            ) {
                return;
            }

            if (
                message.startsWith("/nick ")
            ) {
                username =
                    message
                        .substring(6)
                        .trim();

                if (username) {
                    usernameElement.textContent =
                        username;
                }
            }

            socket.send(message);

            input.value = "";
        }
    );
</script>

</body>
</html>
