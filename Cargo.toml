[package]
name = "messenger"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "College chat on Rust + Tokio, an analog of Messenger-From-C-Boost-Beast"
license = "MIT"
repository = "https://github.com/nikitu0008-collab/Messenger-From-Rust-Tokio"
readme = "README.md"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
strip = true
